name: Pre-generate and cache membership certificates (manual refresh)

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-membership-certificates.yml"
      - "scripts/generate_membership_certificates.py"
      - "assets/membership-certificate-aligned.js"
      - "assets/membership-certificate-v4.js"
      - "member-account.html"

permissions:
  contents: write

concurrency:
  group: membership-certificates-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image, QR and Persian text dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests pillow qrcode[pil] pyzbar arabic-reshaper python-bidi jdatetime

      - name: Generate only missing or changed certificates
        run: python scripts/generate_membership_certificates.py

      - name: Create fast certificate previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for source in sorted(Path('assets/certificates').glob('member-*.png')):
              full_webp = source.with_suffix('.webp')
              preview_webp = source.with_name(source.stem + '.preview.webp')
              with Image.open(source) as original:
                  image = original.convert('RGB')
                  # Keep the full-size WebP lossless for high-quality downloads.
                  image.save(full_webp, 'WEBP', lossless=True, method=6)
                  # Admin preview is a separate, much smaller file for quick display.
                  preview = image.copy()
                  preview.thumbnail((1500, 1500), Image.Resampling.LANCZOS)
                  preview.save(preview_webp, 'WEBP', quality=78, method=5, optimize=True)
              print(f'{source.name}: {source.stat().st_size:,} bytes; preview: {preview_webp.stat().st_size:,} bytes')
          PY

      - name: Commit cached member certificates
        run: |
          if [ -z "$(git status --porcelain -- assets/certificates)" ]; then
            echo "All member certificates are already generated and current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/certificates/
          git commit -m "Pre-generate and cache approved membership certificates"
          # Other site updates may land while images are being encoded.
          # Rebase generated assets onto the latest main before pushing.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Optimized membership certificates published."
              exit 0
            fi
            echo "Push race detected; retrying after refreshing main (attempt $attempt)."
            sleep $((attempt * 3))
          done
          echo "Could not publish optimized certificates after retries."
          exit 1
