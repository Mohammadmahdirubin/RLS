name: Generate and optimize membership certificates

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-membership-certificates.yml"
      - "scripts/generate_membership_certificates.py"
      - "assets/membership-certificate-aligned.js"
      - "assets/membership-certificate-v4.js"
      - "member-account.html"

permissions:
  contents: write

concurrency:
  group: membership-certificates-optimized
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image, QR and Persian text dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libraqm-dev libjpeg-dev zlib1g-dev libfreetype6-dev libwebp-dev libtiff-dev libopenjp2-7-dev fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install --no-binary=Pillow pillow
          python -m pip install requests qrcode[pil] pyzbar jdatetime
          python -c "from PIL import features; assert features.check_feature('raqm'), 'Pillow was built without libraqm/RAQM support'"

      - name: Generate only missing or changed certificates
        run: python scripts/generate_membership_certificates.py

      - name: Build compact preview and high-quality WebP variants
        run: echo "WebP variants are generated and QR-checked by the certificate generator."

      - name: Publish certificates without manifest rebase conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/generate_membership_certificates.py
            if [ -z "$(git status --porcelain -- assets/certificates)" ]; then
              echo "All approved member certificates are already generated and current."
              exit 0
            fi
            git add assets/certificates/
            git commit -m "Pre-generate and cache approved membership certificates"
            if git push origin HEAD:main; then
              echo "Original membership certificates published."
              exit 0
            fi
            echo "Main changed during publish; regenerating from latest main (attempt $attempt)."
            sleep $((attempt * 3))
          done
          echo "Could not publish optimized certificates after retries."
          exit 1
