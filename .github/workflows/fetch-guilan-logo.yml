name: Fetch Guilan logo PNG
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-guilan-logo.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download logo and update board
        run: |
          set -e
          curl -fsSL -o guilan-logo.png "https://litter.catbox.moe/9zmteb.png"
          file guilan-logo.png
          wc -c guilan-logo.png
          python3 << 'PY'
          from pathlib import Path
          h = Path('editorial-board.html').read_text(encoding='utf-8')
          h2 = h.replace('guilan-logo.svg', 'guilan-logo.png')
          # also force if text-only link remains
          if 'guilan-logo.png' not in h2 and ('نباتی' in h2 or 'Nabati' in h2):
              h2 = h2.replace(
                  'title="University of Guilan"><a href="https://guilan.ac.ir/" target="_blank" rel="noopener">',
                  'title="University of Guilan"><a href="https://guilan.ac.ir/" target="_blank" rel="noopener"><img src="guilan-logo.png" alt="University of Guilan">'
              )
          Path('editorial-board.html').write_text(h2, encoding='utf-8')
          print('png refs', h2.count('guilan-logo.png'))
          print('svg refs', h2.count('guilan-logo.svg'))
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guilan-logo.png editorial-board.html
          git status
          git commit -m "Add official Guilan university logo PNG under Dr. Shahram Nabati" || echo no-change
          git pull --rebase origin main || true
          git push
