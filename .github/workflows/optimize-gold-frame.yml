name: Optimize gold editorial photo frame

on:
  push:
    paths:
      - ".github/workflows/optimize-gold-frame.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-frame:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert transparent gold frame to lossless WebP
        run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("frame-gold.png")
          target = Path("frame-gold.webp")
          if not source.is_file():
              raise SystemExit("frame-gold.png not found")

          with Image.open(source) as image:
              image.load()
              rgba = image.convert("RGBA")
              rgba.save(target, "WEBP", lossless=True, method=6)

          original_size = source.stat().st_size
          converted_size = target.stat().st_size
          print(f"Original PNG: {original_size} bytes")
          print(f"Lossless WebP: {converted_size} bytes")
          print(f"Reduction: {(1 - converted_size / original_size) * 100:.2f}%")

          if converted_size >= original_size:
              target.unlink()
              raise SystemExit("Lossless WebP is not smaller; PNG references were left unchanged.")
          PY

      - name: Update all three editorial board pages
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              Path("editorial-board.html"),
              Path("en/editorial-board.html"),
              Path("ru/editorial-board.html"),
          ]
          old = 'url("/frame-gold.png")'
          new = 'url("/frame-gold.webp")'

          for page in pages:
              html = page.read_text(encoding="utf-8")
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f"{page}: expected exactly one frame reference, found {count}")
              page.write_text(html.replace(old, new), encoding="utf-8")
              print(f"Updated {page}")
          PY

      - name: Commit optimized frame and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frame-gold.webp editorial-board.html en/editorial-board.html ru/editorial-board.html
          git commit -m "Serve editorial gold frame as lossless WebP"
          git push
