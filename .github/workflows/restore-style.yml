name: restore-style
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-style.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: restore full css
        run: |
          set -eux
          # restore full style from commit before we broke it
          git show aec559ccc84a53860964d65e8cf279a9df349730:assets/style.css > assets/style.css
          python3 -c "
          from pathlib import Path
          p = Path('assets/style.css')
          css = p.read_text(encoding='utf-8')
          rule = '''\n/* Force left-align for English Abstract / Keywords headings on RTL article pages */\n.content h2[dir=\"ltr\"],\n.content h3[dir=\"ltr\"],\n.article-layout .content h2[dir=\"ltr\"],\n.article-layout .content h3[dir=\"ltr\"] {\n  direction: ltr !important;\n  text-align: left !important;\n  unicode-bidi: isolate;\n}\n.content p[dir=\"ltr\"],\n.content div[dir=\"ltr\"],\n.article-layout .content p[dir=\"ltr\"] {\n  direction: ltr !important;\n  text-align: left !important;\n  unicode-bidi: isolate;\n}\n'''
          if 'Force left-align for English Abstract' not in css:
              p.write_text(css.rstrip() + rule, encoding='utf-8')
          print('css size', p.stat().st_size)
          print('starts with root', css.startswith(':root') or ':root' in css[:200])
          "
      - name: push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/style.css
          git commit -m 'Restore full style.css and keep LTR English Abstract rules' || exit 0
          git push
