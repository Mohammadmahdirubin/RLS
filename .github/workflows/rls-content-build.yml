name: RLS multilingual content build

on:
  push:
    paths:
      - "content/**"
      - "scripts/**"
      - ".github/workflows/rls-content-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Translate missing fields
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL }}
        run: node scripts/translate-rls-content.mjs
      - name: Generate article pages
        run: node scripts/generate-article-pages.mjs
      - name: Register authors
        run: node scripts/sync-authors.mjs
      - name: Update issue
        run: node scripts/sync-issues.mjs
      - name: Update metrics
        run: node scripts/sync-metrics.mjs
      - name: Generate manifest
        run: node scripts/generate-rls-content.mjs
      - name: Commit generated changes
        run: |
          git config user.name "RLS Content Builder"
          git config user.email "actions@users.noreply.github.com"
          git add content assets/articles-data.js articles/1/README.md *.html en/*.html ru/*.html
          if git diff --cached --quiet; then echo "No generated changes."; else git commit -m "chore: build multilingual article content"; git push; fi
