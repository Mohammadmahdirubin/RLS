name: RLS multilingual content build

on:
  push:
    paths:
      - "content/**"
      - "scripts/generate-rls-content.mjs"
      - ".github/workflows/rls-content-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate multilingual content
        run: node scripts/generate-rls-content.mjs
      - name: Commit generated manifest
        run: |
          git config user.name "RLS Content Builder"
          git config user.email "actions@users.noreply.github.com"
          git add content/generated-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: update multilingual content manifest"
            git push
          fi
