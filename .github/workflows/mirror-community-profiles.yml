name: Mirror approved community profiles to GitHub

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-community-profiles.yml"
      - "scripts/sync_community_profiles.py"
      - "assets/community.js"

permissions:
  contents: write

concurrency:
  group: community-profile-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install requests
      - name: Sync only approved public profiles and avatars
        run: python scripts/sync_community_profiles.py
      - name: Publish mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/community-members.json assets/community-profiles/avatars/
          if git diff --cached --quiet; then
            echo "Mirror is already up to date."
            exit 0
          fi
          git commit -m "Sync approved public community profiles"
          git push origin HEAD:main
