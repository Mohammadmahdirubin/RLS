name: Mirror approved community profiles and certificates to GitHub

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-community-profiles.yml"
      - "scripts/sync_community_profiles.py"
      - "scripts/translate_community_profiles.py"
      - "scripts/generate_membership_certificates.py"
      - "assets/community.js"

permissions:
  contents: write

concurrency:
  group: community-member-sync
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image, QR, Persian text and HTTP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libraqm-dev libjpeg-dev zlib1g-dev libfreetype6-dev libwebp-dev libtiff-dev libopenjp2-7-dev fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install --no-binary=Pillow pillow
          python -m pip install requests qrcode[pil] pyzbar jdatetime
          python -c "from PIL import features; assert features.check_feature('raqm'), 'Pillow was built without libraqm/RAQM support'"
      - name: Publish profiles, avatars, translations and certificates safely
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_community_profiles.py
            python scripts/translate_community_profiles.py
            python scripts/generate_membership_certificates.py
            git add assets/community-members.json assets/community-profiles/avatars/ assets/certificates/
            if git diff --cached --quiet; then
              echo "Public profiles, avatars and certificates are current."
              exit 0
            fi
            git commit -m "Sync approved community profiles and membership certificates"
            if git push origin HEAD:main; then
              echo "Profiles and certificates published to GitHub."
              exit 0
            fi
            echo "Main changed during publish; resyncing from latest main (attempt $attempt)."
            sleep $((attempt * 3))
          done
          echo "Could not publish community mirror after retries."
          exit 1
