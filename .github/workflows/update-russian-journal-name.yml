name: Update Russian journal name

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-name:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Russian journal name everywhere
        run: |
          OLD='Исследования русского языка'
          NEW='Исследования по русскому языку'
          grep -rl --exclude-dir=.git -- "$OLD" . | xargs -r sed -i "s/$OLD/$NEW/g"

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed.'
          else
            git add .
            git commit -m 'Set Russian journal name to Исследования по русскому языку everywhere'
            git push
          fi
