name: RLS SEO and Scholar Guard
on:
  push:
    branches: [main]
    paths:
      - 'assets/articles-data.js'
      - '*.html'
      - 'en/*.html'
      - 'ru/*.html'
      - 'articles/**'
      - 'scripts/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'feed.xml'
      - '.github/workflows/rls-seo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize metadata, schema, sitemap and feed
        run: node scripts/sync-scholar-metadata.mjs
      - name: Run SEO and Scholar audit
        run: node scripts/seo-audit.mjs
      - name: Commit generated files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'en/*.html' 'ru/*.html' sitemap.xml feed.xml
          git commit -m "Auto-sync RLS scholarly metadata and index files [skip ci]"
          git push
