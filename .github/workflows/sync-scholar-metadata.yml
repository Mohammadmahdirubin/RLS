name: Sync scholarly metadata
on:
  push:
    branches: [main]
    paths:
      - 'assets/articles-data.js'
      - 'article-*.html'
      - 'en/article-*.html'
      - 'ru/article-*.html'
      - 'scripts/sync-scholar-metadata.mjs'
      - '.github/workflows/sync-scholar-metadata.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/sync-scholar-metadata.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-*.html en/article-*.html ru/article-*.html sitemap.xml
          git commit -m "Auto-sync scholarly metadata [skip ci]"
          git push
