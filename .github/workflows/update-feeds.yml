name: Update RSS and Atom feeds

on:
  push:
    branches: [main]
    paths:
      - 'assets/articles-data.js'
      - 'metadata/articles.json'
      - '.github/workflows/update-feeds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate RSS and Atom feeds from published article data
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('assets/articles-data.js', 'utf8');
          const match = raw.match(/window\.RLS_ARTICLES\s*=\s*(\[[\s\S]*\])\s*;?/);
          if (!match) throw new Error('Could not parse window.RLS_ARTICLES');
          const articles = JSON.parse(match[1]).filter(a => a.status === 'published');
          const esc = value => String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
          const dateOf = a => {
            const value = a.online || a.publicationDate || a.published || a.accepted || a.received;
            const d = value ? new Date(String(value).replaceAll('/','-') + (String(value).length === 10 ? 'T00:00:00Z' : '')) : new Date();
            return Number.isNaN(d.getTime()) ? new Date() : d;
          };
          const urlOf = a => 'https://rlsj.ir/article-' + encodeURIComponent(a.id) + '.html';
          const rssItems = articles.map(a => {
            const url = urlOf(a), date = dateOf(a).toUTCString();
            const title = a.title?.en || a.title?.fa || a.id;
            const description = a.abstract?.en || a.abstract?.fa || '';
            const author = a.author || a.authorGiven || 'Russian Language Studies';
            return `    <item>\n      <title>${esc(title)}</title>\n      <link>${esc(url)}</link>\n      <guid isPermaLink="true">${esc(url)}</guid>\n      <pubDate>${date}</pubDate>\n      <description>${esc(description)}</description>\n      <author>${esc(author)}</author>\n    </item>`;
          }).join('\n');
          const now = new Date().toUTCString();
          const rss = `<?xml version="1.0" encoding="UTF-8"?>\n<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">\n  <channel>\n    <title>Russian Language Studies</title>\n    <link>https://rlsj.ir/</link>\n    <description>Latest published articles from Russian Language Studies.</description>\n    <language>en</language>\n    <atom:link href="https://rlsj.ir/rss.xml" rel="self" type="application/rss+xml" />\n    <lastBuildDate>${now}</lastBuildDate>\n${rssItems}\n  </channel>\n</rss>\n`;
          const atomEntries = articles.map(a => {
            const url = urlOf(a), date = dateOf(a).toISOString();
            return `  <entry>\n    <title>${esc(a.title?.en || a.title?.fa || a.id)}</title>\n    <id>${esc(url)}</id>\n    <link href="${esc(url)}" />\n    <updated>${date}</updated>\n    <summary>${esc(a.abstract?.en || a.abstract?.fa || '')}</summary>\n    <author><name>${esc(a.author || 'Russian Language Studies')}</name></author>\n  </entry>`;
          }).join('\n');
          const atom = `<?xml version="1.0" encoding="UTF-8"?>\n<feed xmlns="http://www.w3.org/2005/Atom">\n  <title>Russian Language Studies</title>\n  <id>https://rlsj.ir/</id>\n  <link href="https://rlsj.ir/feed.xml" rel="self" />\n  <link href="https://rlsj.ir/" />\n  <updated>${new Date().toISOString()}</updated>\n${atomEntries}\n</feed>\n`;
          fs.writeFileSync('rss.xml', rss);
          fs.writeFileSync('feed.xml', atom);
          console.log(`Generated feeds for ${articles.length} published articles.`);
          NODE

      - name: Commit updated feeds
        run: |
          if git diff --quiet -- rss.xml feed.xml; then
            echo "Feeds are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml feed.xml
          git commit -m "Automatically update RSS and Atom feeds"
          git push
