name: Optimize editorial board images

on:
  push:
    paths:
      - ".github/workflows/optimize-editorial-board-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Convert locally hosted editorial images to WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit, urlunsplit
          from PIL import Image
          import re

          page = Path("editorial-board.html")
          html = page.read_text(encoding="utf-8")
          converted = {}
          report = []

          def local_source(src):
              parsed = urlsplit(src)
              if parsed.scheme or parsed.netloc or not parsed.path:
                  return None
              raw = unquote(parsed.path)
              while raw.startswith("../"):
                  raw = raw[3:]
              raw = raw.lstrip("/")
              if not raw or raw.startswith("../"):
                  return None
              path = Path(raw)
              if not path.is_file():
                  return None
              return path, parsed

          for match in re.finditer(r'<img\b[^>]*\bsrc=["\']([^"\']+)["\'][^>]*>', html, re.I):
              src = match.group(1)
              if src in converted:
                  continue
              item = local_source(src)
              if not item:
                  continue
              source, parsed = item
              ext = source.suffix.lower()
              if ext in (".webp", ".svg", ".gif", ".avif"):
                  continue
              if ext not in (".jpg", ".jpeg", ".png"):
                  continue

              target = source.with_suffix(".webp")
              if target.exists():
                  report.append(f"SKIP existing WebP: {target}")
                  continue

              try:
                  with Image.open(source) as im:
                      im.load()
                      has_alpha = "A" in im.getbands() or "transparency" in im.info
                      if has_alpha:
                          prepared = im.convert("RGBA")
                      else:
                          prepared = im.convert("RGB")
                      prepared.save(
                          target,
                          "WEBP",
                          quality=92 if ext == ".png" else 89,
                          method=6,
                          lossless=has_alpha
                      )
                  if target.stat().st_size >= source.stat().st_size:
                      target.unlink()
                      report.append(f"KEEP original (WebP not smaller): {source}")
                      continue

                  new_path = str(Path(parsed.path).with_suffix(".webp"))
                  converted[src] = urlunsplit(("", "", new_path, parsed.query, parsed.fragment))
                  report.append(
                      f"CONVERT {source}: {source.stat().st_size} -> {target.stat().st_size} bytes"
                  )
              except Exception as exc:
                  if target.exists():
                      target.unlink()
                  report.append(f"ERROR {source}: {exc}")

          def replace_src(match):
              tag = match.group(0)
              src_match = re.search(r'\bsrc=(["\'])(.*?)\1', tag, re.I)
              if not src_match:
                  return tag
              old = src_match.group(2)
              new = converted.get(old)
              if not new:
                  return tag
              return tag[:src_match.start(2)] + new + tag[src_match.end(2):]

          new_html = re.sub(r'<img\b[^>]*>', replace_src, html, flags=re.I)
          if new_html != html:
              page.write_text(new_html, encoding="utf-8")

          print("\n".join(report) if report else "No eligible local images found.")
          print(f"Updated image references: {len(converted)}")
          PY

      - name: Commit optimized images and references
        run: |
          if git diff --quiet; then
            echo "No image optimization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-board.html
          git add -- '*.webp'
          git commit -m "Optimize editorial board images without removing originals"
          git push
