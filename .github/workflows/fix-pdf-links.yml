name: Fix PDF links to articles/1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-pdf-links.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update PDF paths in HTML
        run: |
          find . -name '*.html' -print0 | xargs -0 sed -i \
            -e 's|articles/rubin-2026-ai-supported-multimodal-rfl\.pdf|articles/1/rubin-2026-ai-supported-multimodal-rfl.pdf|g' \
            -e 's|articles/Norouzi-2026-The-Role-of-Context-in-Understanding-Russian-Verbal-Aspect\.pdf|articles/1/Norouzi-2026-The-Role-of-Context-in-Understanding-Russian-Verbal-Aspect.pdf|g'
          # undo double prefix if any
          find . -name '*.html' -print0 | xargs -0 sed -i 's|articles/1/1/|articles/1/|g'
          echo "Sample matches:"
          grep -rn 'articles/1/' --include='*.html' | head -20 || true
      - name: Restore full article 2 FA if shortened
        run: |
          # ensure Norouzi FA page still has download buttons
          if ! grep -q 'articles/1/Norouzi' article-role-of-context-russian-verbal-aspect.html; then
            echo "WARNING: FA article 2 missing new path"
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update all article PDF links to articles/1/ (issue 1)"
          git push
