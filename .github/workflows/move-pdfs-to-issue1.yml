name: Move PDFs to articles/1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/move-pdfs-to-issue1.yml'
jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move issue-1 PDFs into articles/1
        run: |
          mkdir -p articles/1
          if [ -f articles/rubin-2026-ai-supported-multimodal-rfl.pdf ]; then
            mv articles/rubin-2026-ai-supported-multimodal-rfl.pdf articles/1/
          fi
          if [ -f articles/Norouzi-2026-The-Role-of-Context-in-Understanding-Russian-Verbal-Aspect.pdf ]; then
            mv articles/Norouzi-2026-The-Role-of-Context-in-Understanding-Russian-Verbal-Aspect.pdf articles/1/
          fi
          ls -la articles/ articles/1/ || true
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Move issue 1 PDFs into articles/1/"
          git push
