name: Optimize all editorial board images

on:
  push:
    paths:
      - "editorial-board.html"
      - ".github/workflows/convert-editorial-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-board-image-optimization
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Recompress large WebP photos and logos
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote, quote, urlunsplit
          from html import unescape
          from PIL import Image, ImageOps
          import os
          import re

          page = Path("editorial-board.html")
          source_html = page.read_text(encoding="utf-8")
          report = []
          changed = []
          total_before = 0
          total_after = 0
          THRESHOLD = 75 * 1024
          QUALITY = 82

          def target_dimensions(tag):
              def attr(name, fallback):
                  m = re.search(rf"""\\b{name}=["'](\\d+)""", tag, re.I)
                  return int(m.group(1)) if m else fallback
              width, height = attr("width", 170), attr("height", 200)
              # 4x CSS dimensions retain detail for desktop hover and high-DPI screens.
              return (min(width * 4, 680), min(height * 4, 800))

          def encode_image(source, temp, max_size):
              with Image.open(source) as opened:
                  image = ImageOps.exif_transpose(opened)
                  image.load()
                  if "A" in image.getbands():
                      image = image.convert("RGBA")
                  elif image.mode not in ("RGB", "L"):
                      image = image.convert("RGB")
                  image = ImageOps.contain(
                      image, max_size, method=Image.Resampling.LANCZOS
                  )
                  image.save(temp, "WEBP", quality=QUALITY, method=6, exact=True)

          def rewrite_image(match):
              tag = match.group(0)
              attr = re.search(r"""\\bsrc=(["'])(.*?)\\1""", tag, re.I)
              if not attr:
                  return tag
              raw_src = unescape(attr.group(2))
              parsed = urlsplit(raw_src)
              if parsed.scheme or parsed.netloc or not parsed.path:
                  return tag

              rel = unquote(parsed.path).lstrip("/")
              source = Path(rel)
              if source.suffix.lower() not in {".jpg", ".jpeg", ".png", ".webp"}:
                  return tag
              if not source.is_file():
                  raise SystemExit(f"Missing local source image: {source}")

              original_bytes = source.stat().st_size
              is_webp = source.suffix.lower() == ".webp"
              if is_webp and original_bytes <= THRESHOLD:
                  return tag

              target = source if is_webp else source.with_suffix(".webp")
              temp = target.with_name(target.stem + ".rls-tmp.webp")
              target.parent.mkdir(parents=True, exist_ok=True)

              try:
                  encode_image(source, temp, target_dimensions(tag))
                  optimized_bytes = temp.stat().st_size

                  if is_webp:
                      # Keep the original unless the new WebP is at least 4% smaller.
                      if optimized_bytes >= original_bytes * 0.96:
                          return tag
                  elif optimized_bytes >= original_bytes:
                      return tag

                  os.replace(temp, target)
                  report.append((source.as_posix(), target.as_posix(),
                                 original_bytes, optimized_bytes))
                  changed.append(target.as_posix())

                  if is_webp:
                      return tag
                  new_path = "/" + quote(target.as_posix(), safe="/")
                  new_url = urlunsplit(("", "", new_path, parsed.query, parsed.fragment))
                  return tag[:attr.start(2)] + new_url + tag[attr.end(2):]
              finally:
                  if temp.exists():
                      temp.unlink()

          updated_html = re.sub(r"<img\\b[^>]*>", rewrite_image, source_html, flags=re.I)
          page.write_text(updated_html, encoding="utf-8")

          for source, target, before, after in report:
              total_before += before
              total_after += after
              print(f"{source}: {before:,} -> {target}: {after:,} bytes")
          print(f"Optimized assets: {len(changed)}")
          print(f"Bytes saved: {total_before - total_after:,}")
          Path("editorial-image-optimization.txt").write_text(
              "\\n".join(
                  [f"{a} -> {b}: {c} -> {d}" for a,b,c,d in report]
                  + [f"TOTAL: {total_before} -> {total_after}; SAVED: {total_before-total_after}"]
              ) + "\\n",
              encoding="utf-8"
          )
          if not changed:
              print("No referenced image exceeded the threshold or no smaller encoding was produced.")
          PY

      - name: Validate all image references
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          from html import unescape
          import re
          html = Path("editorial-board.html").read_text(encoding="utf-8")
          missing = []
          for tag in re.findall(r"<img\b[^>]*>", html, flags=re.I):
              m = re.search(r"""\bsrc=(["'])(.*?)\1""", tag, re.I)
              if not m:
                  continue
              src = unescape(m.group(2))
              if src.startswith(("http://", "https://", "data:", "blob:")):
                  continue
              path = unquote(src.split("?",1)[0].split("#",1)[0].lstrip("/"))
              if not Path(path).is_file():
                  missing.append(src)
          if missing:
              raise SystemExit("Broken image references: " + ", ".join(missing))
          print("All editorial board image references exist locally.")
          PY

      - name: Commit optimized files and updated references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- editorial-board.html '*.webp'
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Optimize remaining editorial board images"
          git pull --rebase origin main
          git push

      - name: Upload optimization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-image-optimization-report
          path: editorial-image-optimization.txt
          if-no-files-found: ignore
          retention-days: 14
