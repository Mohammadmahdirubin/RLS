name: Convert editorial photos to lossless WebP

on:
  push:
    paths:
      - ".github/workflows/convert-editorial-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Convert selected PNGs without loss
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          names = ["دکتر بیگی.png", "مهناز نوروزی.png"]
          out = Path("webp-review")
          out.mkdir(exist_ok=True)
          lines = ["Lossless WebP conversion report", "Original PNG files were not modified.", ""]

          for name in names:
              src = Path(name)
              if not src.is_file():
                  raise SystemExit(f"Missing source image: {name}")

              with Image.open(src) as im:
                  im.load()
                  dims = f"{im.width}x{im.height}"
                  mode = im.mode
                  target = out / (src.stem + ".webp")
                  im.save(target, "WEBP", lossless=True, quality=100, method=6, exact=True)

              original = src.stat().st_size
              converted = target.stat().st_size
              delta = (1 - converted / original) * 100
              lines.append(
                  f"{name}: {original:,} bytes -> {target.name}: {converted:,} bytes | "
                  f"{dims} | mode={mode} | size change={delta:+.2f}%"
              )

          report = "\n".join(lines) + "\n"
          (out / "conversion-report.txt").write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: editorial-photos-lossless-webp
          path: webp-review/
          if-no-files-found: error
          retention-days: 14

      - name: Commit WebP files without touching originals
        shell: bash
        run: |
          cp webp-review/*.webp .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "دکتر بیگی.webp" "مهناز نوروزی.webp"
          git commit -m "Add lossless WebP editorial portraits"
          git push
