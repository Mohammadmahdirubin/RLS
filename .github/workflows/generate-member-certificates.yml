name: Generate and store member certificates

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/member-certificates/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: member-certificates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certificate generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow qrcode[pil] arabic-reshaper python-bidi jdatetime

      - name: Generate each missing approved certificate once
        run: python scripts/generate_member_certificates.py

      - name: Report stored certificates
        if: always()
        run: |
          if [ -d assets/member-certificates ]; then
            echo "Stored certificate files:"
            find assets/member-certificates -maxdepth 1 -type f -printf '%f %k KB\n' | sort
          else
            echo "No certificates generated in this run."
          fi
