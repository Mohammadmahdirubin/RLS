name: Add Guilan logo under Nabati
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-guilan-logo.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write logo and update boards
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          Path('guilan-logo.png').write_bytes(base64.b64decode(""""""))
          print('logo', Path('guilan-logo.png').stat().st_size)
          def fix(path, old, new):
              t = Path(path).read_text(encoding='utf-8')
              if old in t:
                  Path(path).write_text(t.replace(old, new, 1), encoding='utf-8')
                  print(path, 'updated')
              elif 'guilan-logo.png' in t:
                  print(path, 'already')
              else:
                  print(path, 'no match')
          fix('editorial-board.html',
              '<div class="university-logo-box" title="دانشگاه گیلان"><a href="https://guilan.ac.ir/" target="_blank" rel="noopener">دانشگاه گیلان</a></div>',
              '<div class="university-logo-box" title="دانشگاه گیلان"><a href="https://guilan.ac.ir/" target="_blank" rel="noopener"><img src="guilan-logo.png" alt="لوگوی دانشگاه گیلان"></a></div>')
          fix('en/editorial-board.html',
              '<div class="university-logo-box" title="University of Guilan"><a href="https://guilan.ac.ir/" target="_blank" rel="noopener">University of Guilan</a></div>',
              '<div class="university-logo-box" title="University of Guilan"><a href="https://guilan.ac.ir/" target="_blank" rel="noopener"><img src="../guilan-logo.png" alt="University of Guilan logo"></a></div>')
          fix('ru/editorial-board.html',
              '<div class="university-logo-box" title="Университет Гилян"><a href="https://guilan.ac.ir/" target="_blank" rel="noopener">Университет Гилян</a></div>',
              '<div class="university-logo-box" title="Университет Гилян"><a href="https://guilan.ac.ir/" target="_blank" rel="noopener"><img src="../guilan-logo.png" alt="Логотип Университета Гилян"></a></div>')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guilan-logo.png editorial-board.html en/editorial-board.html ru/editorial-board.html
          git diff --staged --quiet && echo No changes && exit 0
          git commit -m "Add University of Guilan logo under Dr. Shahram Nabati"
          git push
