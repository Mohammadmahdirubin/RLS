name: Normalize Russian Journal Name

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'Normalize Russian journal name') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old Russian journal name everywhere
        run: |
          OLD='Исследования русского языка'
          NEW='Исследования по русскому языку'
          find . -type f -not -path './.git/*' -not -path './.github/workflows/fix-russian-name.yml' -print0 | xargs -0 sed -i "s/${OLD}/${NEW}/g"

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No old Russian journal name found.'
            exit 0
          fi
          git add -A
          git commit -m 'Normalize Russian journal name'
          git push
