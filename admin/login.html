<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ورود امن | پنل RLS</title>
<link rel="stylesheet" href="panel.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f6f4ef}
.login-card{width:min(100%,440px);background:#fff;border:1px solid #e6e0d7;border-radius:18px;padding:30px;box-shadow:0 18px 55px #35241a12}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-brand-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#6e1f2b;color:white;font-weight:800;font-size:24px}
.login-card h1{margin:0 0 8px;font-size:1.55rem}.login-card p{color:#6b625b;line-height:1.8}.login-card label{display:block;margin:16px 0 7px;font-weight:700}.login-card input{width:100%;padding:12px;border:1px solid #d9d1c7;border-radius:9px;font:inherit}.login-card button{width:100%;margin-top:20px}.login-message{min-height:28px;color:#8c2634;font-size:.92rem}.login-note{font-size:.82rem;border-top:1px solid #eee5dc;padding-top:15px}
</style>
</head>
<body>
<main class="login-card">
  <div class="login-brand"><div class="login-brand-mark">R</div><div><strong>RLS</strong><div>پنل مدیریت نشریه</div></div></div>
  <h1>ورود به سامانه</h1>
  <p>برای ورود از حسابی استفاده کنید که مدیر سامانه از قبل ایجاد کرده است.</p>
  <form id="loginForm">
    <label for="email">ایمیل سازمانی</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">گذرواژه</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="loginButton">ورود امن</button>
    <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>
  </form>
  <p class="login-note">ثبت‌نام عمومی غیرفعال است. نقش کاربران در پایگاه داده تعیین می‌شود؛ انتخاب نقش از صفحه مرورگر امکان‌پذیر نیست.</p>
</main>
<script src="backend-config.js"></script>
<script type="module">
import { backendConfigured, supabase, getActiveProfile } from "./backend-client.js";
const form = document.getElementById("loginForm");
const message = document.getElementById("loginMessage");
const button = document.getElementById("loginButton");
if (!backendConfigured) {
  message.textContent = "اتصال هنوز پیکربندی نشده است. راهنمای admin/BACKEND-SETUP.md را اجرا کنید.";
  button.disabled = true;
} else {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    const { profile } = await getActiveProfile();
    if (profile) location.replace("panel.html");
  }
  form.addEventListener("submit", async event => {
    event.preventDefault();
    button.disabled = true; message.textContent = "در حال بررسی اطلاعات ورود…";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      message.textContent = "ورود انجام نشد. ایمیل و گذرواژه را بررسی کنید.";
      button.disabled = false; return;
    }
    const { profile, error: profileError } = await getActiveProfile();
    if (profileError || !profile) {
      await supabase.auth.signOut();
      message.textContent = "حساب فعال یا مجوز دسترسی برای این سامانه پیدا نشد.";
      button.disabled = false; return;
    }
    location.replace("panel.html");
  });
}
</script>
</body>
</html>
