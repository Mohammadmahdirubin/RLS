<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editorial Board | Biannual Journal of Russian Language Studies</title>
<meta name="description" content="Editorial Board Biannual Journal of Russian Language Studies and profiles of the journal's academic members.">
<link rel="stylesheet" href="../assets/style.css">
<style>
.board-intro{max-width:900px;margin:0 auto 28px}.board-section-title{margin:40px 0 20px}.board-profile{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:start;background:#cfeecf !important;border:1px solid #8fc98f;padding:24px;margin:0 0 20px;box-shadow:0 10px 24px rgba(64,130,170,.10)}.board-photo{width:170px;height:200px;border:1px solid var(--line);background:#f4eee9;display:flex;align-items:center;justify-content:center;color:#8b6b62;font-size:13px;text-align:center;overflow:hidden}.board-photo img{width:100%;height:100%;object-fit:cover;object-position:center top}.board-profile>div:nth-child(2){background:#cfeecf !important;padding:4px 8px 12px;border-radius:4px}.board-profile h3{margin-top:0;margin-bottom:8px}.board-role{color:var(--accent);font-weight:700;margin-bottom:10px}.board-meta{line-height:1.9}.board-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.board-links a{border:1px solid #c62828;padding:6px 10px;text-decoration:none;background:#c62828;color:#fff;border-radius:6px;font-weight:700;box-shadow:0 2px 5px rgba(198,40,40,.18)}.board-links a:hover{background:#e53935;border-color:#e53935;color:#fff}.profile-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.profile-fields div{padding:10px 12px;background:#faf7f4;border:1px solid var(--line)}.profile-fields strong{display:block;margin-bottom:3px}.membership-list{margin:12px 0 0;padding-right:18px;line-height:1.9}@media(max-width:700px){.board-profile{grid-template-columns:1fr}.board-photo{width:150px;height:175px}.profile-fields{grid-template-columns:1fr}}
</style>
</head>
<body>

</body></html>
