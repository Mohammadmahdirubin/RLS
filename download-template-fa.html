<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دانلود تمپلت فارسی</title>
<style>body{font-family:Tahoma,sans-serif;text-align:center;padding:48px 20px;background:#faf7ec}a{color:#1a5fb4;font-weight:700}</style>
</head>
<body>
<p id="m">در حال آماده‌سازی فایل Word…</p>
<script src="assets/rls_tpl-part-0.js"></script>
<script src="assets/rls_tpl-part-1.js"></script>
<script src="assets/rls_tpl-part-2.js"></script>
<script src="assets/rls_tpl-part-3.js"></script>
<script src="assets/rls_tpl-part-4.js"></script>
<script src="assets/rls_tpl-part-5.js"></script>
<script src="assets/rls_tpl-join.js"></script>
<script>
(function(){
  try{
    var b64=window.RLS_TPL_B64;
    if(!b64) throw new Error('داده بارگذاری نشد');
    var bin=atob(b64);
    var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var blob=new Blob([arr],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="RLS-template-article-fa.docx";
    document.body.appendChild(a);a.click();
    document.getElementById("m").innerHTML='اگر دانلود شروع نشد، <a href="'+url+'" download="RLS-template-article-fa.docx">اینجا کلیک کنید</a>.';
  }catch(e){ document.getElementById("m").textContent="خطا: "+e.message; }
})();
</script>
</body></html>
